name: Feature Pipeline (hourly)

# Runs the feature pipeline every hour and commits the refreshed feature
# store back to the repo. This is the "serverless" data-collection job.

on:
  schedule:
    - cron: "0 * * * *"        # every hour, on the hour (UTC)
  workflow_dispatch: {}          # ...and lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to commit the updated feature store

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATA_MODE: auto
        run: python pipeline.py features

      - name: Commit the updated feature store
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/features
          git commit -m "chore: hourly feature update [skip ci]" || echo "No changes to commit"
          git push
