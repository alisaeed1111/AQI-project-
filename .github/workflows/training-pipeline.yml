name: Training Pipeline (daily)

# Rebuilds the historical feature set, retrains all models, registers the
# best one, and commits the refreshed model + features back to the repo.

on:
  schedule:
    - cron: "30 0 * * *"       # every day at 00:30 UTC
  workflow_dispatch: {}          # ...and lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to commit the updated model

jobs:
  training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill features and train models
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATA_MODE: auto
        run: |
          python pipeline.py backfill
          python pipeline.py train

      - name: Commit the updated model and features
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/features data/models
          git commit -m "chore: daily model retrain [skip ci]" || echo "No changes to commit"
          git push
